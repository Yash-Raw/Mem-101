name: ci

on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: catch landscape pages ageing past their SLA

# Read-only by default; the deploy job widens this for itself alone.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      MEMLAB_LLM: fake      # the whole course runs with no API key
    steps:
      - uses: actions/checkout@v7
      # setup-uv stopped publishing floating major tags after v7,
      # so this one is pinned exactly while the rest track their major.
      - uses: astral-sh/setup-uv@v10.0.1
      # Matches the documented setup in README.md. The `live` extra pulls the
      # anthropic SDK, which nothing imports under MEMLAB_LLM=fake.
      - run: uv sync --dev
      - name: lint
        run: uv run ruff check .
      - name: validators
        run: uv run python tools/check.py
      - name: labs and capstone tests
        run: uv run pytest -q
      # Runs on pull requests too, so a broken site is caught before merge.
      - name: site builds
        run: uv run mkdocs build --strict

  # Publishes to GitHub Pages, but only from main and only once `check` is
  # green -- the site is never newer than the validators that vouch for it.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Serialised rather than cancelled: a half-finished Pages deploy is worse
    # than a queued one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --dev
      - run: uv run mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Default is 10 minutes. On 2026-09-01 a deploy hit that ceiling and
          # aborted client-side while the deployment stayed ACTIVE on Pages'
          # side, which then rejected the next two runs with "due to in progress
          # deployment" -- one transient slow deploy cost three failed runs and
          # left main published-behind for half an hour. Waiting longer is
          # strictly better than abandoning a deployment that is still running.
          timeout: 1200000
