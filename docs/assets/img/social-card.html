<title>Building an Agent Memory Layer</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap");
  :root {
    --bg: #fbfbfc; --fg: #14161a;
    --accent: oklch(0.50 0.11 250);
    --l1: oklch(0.52 0.10 235); --l3: oklch(0.52 0.10 330);

    --faint: color-mix(in srgb, var(--fg) 30%, var(--bg));
    --faintest: color-mix(in srgb, var(--fg) 12%, var(--bg));
    --serif: "Source Serif 4", Georgia, serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: var(--bg); color: var(--fg);
         font-family: var(--serif); display: flex; flex-direction: column;
         justify-content: space-between; padding: 72px 80px; overflow: hidden; }
  .kicker { font-family: var(--mono); font-size: 19px; letter-spacing: 0.10em;
            text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 82px; line-height: 1.04; font-weight: 600; letter-spacing: -0.02em;
       margin: 26px 0 22px; max-width: 15ch; }
  .thesis { font-size: 30px; line-height: 1.42; color: var(--muted); max-width: 34ch; }
  .thesis b { color: var(--fg); font-weight: 600; }
  .bar { display: flex; gap: 4px; margin-top: 34px; width: 640px; }
  .bar span { height: 12px; border-radius: 3px; }
  .foot { display: flex; align-items: flex-end; justify-content: space-between;
          border-top: 1px solid var(--faintest); padding-top: 26px; }
  .stats { display: flex; gap: 44px; font-family: var(--mono); }
  .stat b { display: block; font-size: 34px; font-weight: 500; letter-spacing: -0.01em; }
  .stat span { font-size: 15px; color: var(--muted); letter-spacing: 0.04em; }
  .url { font-family: var(--mono); font-size: 18px; color: var(--accent); }

<body>
  <div>
    <p class="kicker">A hands-on course &middot; 84 lessons &middot; no API key</p>
    <h1>Building an Agent Memory&nbsp;Layer</h1>
    <p class="thesis">RAG is a read path over a corpus someone else wrote.
       A memory layer is dominated by the <b>write path</b>.</p>
    <!-- One segment per pipeline stage, width = its lesson count. The widest
         segments are evolve and govern, which is the whole claim. -->
    <div class="bar">
      <span style="flex: 4; background: var(--faint)" title="orientation: 4"></span>
      <span style="flex: 6; background: var(--faint)" title="extract: 6"></span>

      <span style="flex: 9; background: var(--l1)" title="retrieve: 9"></span>
      <span style="flex: 20; background: var(--l3)" title="evolve: 20"></span>
      <span style="flex: 7; background: var(--faint)" title="assemble: 7"></span>
      <span style="flex: 21; background: var(--l3)" title="govern: 21"></span>
    </div>
  </div>
  <div class="foot">

      <div class="stat"><b>84</b><span>LESSONS</span></div>
