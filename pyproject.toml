[project]
name = "memory-layer-course"
dynamic = ["version"]
description = "A structured, hands-on curriculum for building an agent memory layer."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yash Chaurasia" }]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
live = ["anthropic>=0.40"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4.23", "mkdocs-material>=9.5"]

[tool.uv]
package = true

# The version has one source: memlab.production.release.VERSION, which is what
# the capstone finale prints and what test_lab.py pins. pyproject used to
# carry its own "0.1.0" while every other surface said v0.3.
[tool.hatch.version]
path = "capstone/src/memlab/production/release.py"

[tool.hatch.build.targets.wheel]
packages = ["capstone/src/memlab"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["curriculum", "capstone/tests"]
python_files = ["test_*.py"]
# Every lab ships a file named test_lab.py; importlib mode keeps them from colliding.
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100

# A lab stub imports what the EXERCISE needs, not what the stub body uses --
# the body is one `raise NotImplementedError`, so every one of those imports is
# unused until the learner writes it. Naming them at the top of the file is how
# a learner discovers that `embed_text` lives in `memlab.llm.fake`; before this,
# ten TODOs named a function whose module appeared nowhere a learner reads.
# Narrow on purpose: stubs only, F401 only. `solution.py` stays fully linted.
[tool.ruff.lint.per-file-ignores]
"curriculum/*/*/lab/lab.py" = ["F401"]
